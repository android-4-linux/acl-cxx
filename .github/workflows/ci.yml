# SPDX-License-Identifier: Apache-2.0
# Provenance: plan.md §4 Phase 0 / Gate G0. No GPL-3.0 sources.
#
# The actions below are on their node24 majors (checkout v7, cache v6). The whole v4 line
# of both -- v4.4.0 included -- still declares `using: node20`, which the runner no longer
# honors and force-migrates to node24 with a deprecation warning on every job, so staying
# on v4 bought a warning per job and nothing else. Both majors need runner 2.327.1+, which
# the hosted images are well past; a self-hosted runner would have to be checked.
#
# `runs-on` names an image rather than ubuntu-latest, which began migrating to Ubuntu 26 on
# 2026-10-19. The distinction matters because this build's toolchain IS whatever the image
# ships -- today GCC 13.3.0 and fmt 9.1.0 from noble -- while meson.build asks for
# `dependency('fmt')` with no version bound and builds at warning_level=2 with
# werror=false. Floating the label would therefore have landed a two-major GCC jump and an
# fmt major as a silent change in what CI compiles, and would have quietly given up the
# zero-warning state, which was measured on GCC 13 and is not enforced. Moving this pin is
# a deliberate commit with a run behind it.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # re-run the present job by hand after a cache eviction

permissions:
  contents: read

jobs:
  gates:
    name: Clean-room & license gates (Gate G0)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install REUSE
        run: pipx install reuse
      - name: SPDX headers
        run: ./scripts/check-spdx.sh
      - name: Forbidden licenses (GPL-3.0 family)
        run: ./scripts/check-licenses.sh
      - name: Clean-room provenance (denylist + provenance comments)
        run: ./scripts/check-provenance.sh
      - name: REUSE lint
        run: reuse lint
      - name: AOSP pin is single-sourced (Gate G2.c)
        # third_party/aosp/METADATA is the one home of the AOSP tag. Four other places
        # have to restate it to be readable on their own -- the pinned manifest's
        # filename, that manifest's own default revision, the automotive pairing and the
        # Skia pairing -- and nothing but this step holds them to it. It needs no AOSP
        # checkout and no build, which is the point: a half-done retag fails here in
        # seconds rather than on the one machine that has the 1145 projects synced.
        run: python3 tools/vendor_framework.py pin
      - name: Actions are pinned by sha (Gate G0.d)
        # Every `uses:` in this file names a commit, not a tag. A major tag is a moving
        # pointer by design -- actions/checkout@v7 meant v7.0.0 when we adopted it and
        # v7.0.1 a day later, with nothing in the ref to say so -- and a moved tag runs
        # new code inside a job that has a token and a cache. The trailing `# vX.Y.Z`
        # comment is what makes the sha reviewable; this step requires both.
        run: ./scripts/check-action-pins.sh

  # The tree is a fixed point of ONE clang-format version, so the check is only meaningful
  # at that version -- which is why .clang-format-version exists and why this job asserts
  # it got what it asked for rather than trusting PATH.
  format:
    name: Format (clang-format at the pinned version)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install clang-format at .clang-format-version
        # Pinned because the runner's own clang-format is not the one this tree is
        # formatted with: the version apt serves on ubuntu-latest is 18, and it disagrees
        # with the committed tree in 32 places across 5 files (`struct stat st{}` and C
        # function-pointer casts, mostly). Measured 2026-11-12: 22.1.8 and 23.1.5 both
        # agree with the tree exactly, so it is the floor that matters here rather than
        # the ceiling -- but an unpinned install drifts into a disagreement with no
        # warning, and the gate would then be failing on its own version instead of on
        # the contributor's patch.
        run: pipx install "clang-format==$(cat .clang-format-version)"
      - name: Check every tracked C and C++ file
        run: |
          want=$(cat .clang-format-version)
          got=$(clang-format --version)
          # The image ships a clang-format of its own under /usr/bin. If that one wins on
          # PATH the gate still goes green or red, just against the wrong formatter, so
          # the version is asserted rather than assumed.
          case "$got" in
            *"$want"*) echo "$got" ;;
            *) echo "wanted clang-format $want, PATH has: $got" >&2
               type -a clang-format >&2 || true
               exit 1 ;;
          esac
          mapfile -d '' -t files < <(git ls-files -z \
            '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp')
          echo "checking ${#files[@]} file(s)"
          if clang-format --dry-run -Werror "${files[@]}"; then
            exit 0
          fi
          {
            echo
            echo "Formatting differs from .clang-format. Reformat at the same version:"
            echo "    pipx install clang-format==$want"
            echo "    git ls-files -z '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' \\"
            echo "      | xargs -0 clang-format -i"
            echo
            echo "clang-format does not reach a fixed point in one pass on this tree:"
            echo "trailing-comment alignment oscillates and settles on the second pass, so"
            echo "run that until 'git diff' comes back empty. If a macro-invocation table"
            echo "keeps being repacked differently on every pass, fence it with a bare"
            echo "'// clang-format off' / '// clang-format on' -- a trailing explanation on"
            echo "that comment is NOT recognized and the fence then silently does nothing."
            echo "See src/ndk/bionic_runtime.cpp for the three that needed it."
          } >&2
          exit 1

  dco:
    name: DCO sign-off
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Every commit is Signed-off-by
        # Dependabot cannot put a trailer in its own commits, so a version-update pull
        # request would fail this gate permanently and no action would ever be updated.
        # The exemption is deliberately two conditions wide. The pull request has to have
        # been opened by dependabot[bot] -- which GitHub sets and a contributor cannot
        # forge -- AND the individual commit has to be authored by it. Author identity on
        # its own is self-reported, so matching only on that would let anyone opt out of
        # DCO with one `git config user.email`. A human commit in a Dependabot branch is
        # still checked.
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          bot='dependabot[bot]'
          bad=0
          while read -r sha; do
            if [[ "$PR_AUTHOR" == "$bot" ]] \
               && [[ "$(git show -s --format=%an "$sha")" == "$bot" ]]; then
              echo "skip: $sha authored by $bot (see .github/dependabot.yml)"
              continue
            fi
            if ! git show -s --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+@.+>'; then
              echo "FAIL: commit $sha missing DCO Signed-off-by" >&2
              bad=1
            fi
          done < <(git rev-list "$range")
          exit $bad

  # This job builds the configuration a bare runner can reach: no pinned Skia, so no Ganesh
  # Vulkan, and no wcs checkout, so wm/ is the stub presenter. The Skia + Vulkan + wcs
  # configuration -- the one that actually presents an app -- needs a 151 MB prebuilt Skia m150
  # prefix and is NOT covered here. Adding it means caching that prefix; until then, a green run
  # means the stub configuration compiles and its tests pass, nothing more.
  build:
    name: Build & test (Meson, stub presenter / no Skia)
    runs-on: ubuntu-24.04
    # A hung mirror once held Install toolchain open for 87 minutes with no output. The job
    # cap bounds the damage; the step cap and the per-attempt timeout below are what actually
    # turn a hang into a retry.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        # The runner's mirror list periodically serves an index whose pool has already moved on.
        # Two failure modes, both infrastructure rather than build: every fetch 404s ("Unable to
        # fetch some archives"), or the mirror accepts the connection and goes slow or silent.
        # Re-running update before each attempt picks up the rotated mirror; the Acquire timeouts
        # and the outer `timeout` bound the silent case, which retries alone cannot reach. The
        # third defense is wanting less: default-jdk pulled a full JDK plus the X11 dev chain,
        # 135 MB over 33 packages, and the run that failed this way stalled on one 46.7 MB openjdk
        # archive until all three attempts timed out. The image already has g++, python3, zlib and
        # two Temurin JDKs, so what is left to fetch is Meson, Ninja, pkg-config and libfmt.
        timeout-minutes: 15
        run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for attempt in 1 2 3; do
            # shellcheck disable=SC2086
            timeout 240 sudo apt-get update -qq $apt_opts || true
            # shellcheck disable=SC2086
            if timeout 240 sudo apt-get install -y $apt_opts \
                 meson ninja-build g++ pkg-config \
                 libfmt-dev zlib1g-dev libssl-dev python3; then
              exit 0
            fi
            echo "apt attempt ${attempt} failed or timed out; retrying"
            sleep 15
          done
          echo "apt failed three times" >&2
          exit 1
      - name: Export JAVA_HOME for the JVM backend detection
        # The runner image ships Temurin JDKs, so none is installed above. meson.build does not
        # read JAVA_HOME -- it runs `java -XshowSettings:properties` and takes java.home from it
        # -- so this only has to agree with the `java` on PATH. Assert jni.h is there: without
        # it the JVM backend compiles out silently and the job would still go green while
        # testing less than it claims to.
        run: |
          jh="${JAVA_HOME_21_X64:-$JAVA_HOME}"
          test -f "$jh/include/jni.h" || { echo "no jni.h under $jh" >&2; exit 1; }
          echo "JAVA_HOME=$jh" >> "$GITHUB_ENV"
          java -XshowSettings:properties -version 2>&1 | grep 'java.home'
      - name: Fetch Catch2 (Tier A tests)
        run: meson wrap install catch2 || true
      - name: Configure (automotive profile, default ON)
        run: meson setup build
      - name: Compile
        shell: bash          # pipefail, so a failed compile still fails the step through tee
        run: meson compile -C build 2>&1 | tee compile-automotive.log
      - name: Zero warnings in acl's own code (Gate G0.e)
        run: ./scripts/check-warnings.sh compile-automotive.log
      - name: Run the stub
        run: ./build/src/shell/a4l
      - name: Test
        run: meson test -C build --print-errorlogs

      - name: Configure phone profile
        run: meson setup build-phone -Dprofile_automotive=false
      - name: Compile phone profile
        shell: bash
        run: meson compile -C build-phone 2>&1 | tee compile-phone.log
      - name: Zero warnings in the phone profile (Gate G0.e)
        run: ./scripts/check-warnings.sh compile-phone.log
      - name: Automotive nm-diff gate (symbols present when ON, absent when OFF)
        run: scripts/check-automotive-symbols.sh build build-phone

  # The configuration the stub job deliberately leaves out: pinned Skia, the Ganesh Vulkan
  # present path and the real wcs Wayland presenter -- together, the path that actually puts an
  # app's pixels on a surface. It needs a Skia prefix, which no distribution ships, so the job
  # builds one with the recipe both projects share (wcs scripts/build-skia.sh) and caches it.
  # A cache hit costs a ~150 MB restore and the job behaves like any other; a miss costs a full
  # Skia build from source, which is what the timeout allows for.
  present:
    name: Build & test (Meson, Skia + Vulkan + wcs present path)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the wcs and Skia pins
        # Neither pin is repeated here. The wcs commit has one home, the wrap; the Skia
        # commit has one home, SKIA_REF in that commit's build-skia.sh. Reading them out is
        # what keeps the cache key honest when either one moves -- a stale prefix would
        # otherwise be restored against a bumped pin and the job would test the wrong Skia.
        #
        # SKIA_REF has to be a commit, and this step fails if it is not. A branch name in the
        # key does not change when the branch moves, so the first saved prefix would be served
        # under that key forever, and a rebuild after a cache eviction would quietly use a
        # different Skia with nothing in the key to show it.
        id: pins
        run: |
          wcs_rev=$(sed -n 's/^revision *= *\([0-9a-f]\{40\}\) *$/\1/p' \
                    subprojects/wayland-cxx-scanner.wrap)
          test -n "$wcs_rev" || {
            echo "no 40-char revision in subprojects/wayland-cxx-scanner.wrap" >&2; exit 1; }
          git clone --filter=blob:none --no-checkout \
            https://github.com/jwinarske/wayland-cxx-scanner.git "$RUNNER_TEMP/wcs"
          git -C "$RUNNER_TEMP/wcs" checkout --quiet "$wcs_rev"
          skia_ref=$(sed -n 's/^SKIA_REF="\([0-9a-f]\{40\}\)"$/\1/p' \
                     "$RUNNER_TEMP/wcs/scripts/build-skia.sh")
          test -n "$skia_ref" || {
            echo "wcs scripts/build-skia.sh does not pin SKIA_REF to a 40-char commit sha." >&2
            echo "A milestone branch there makes this cache key meaningless; see the note" >&2
            echo "on this step." >&2; exit 1; }
          metadata_sha=$(sed -n 's/^sha: *"\([0-9a-f]\{40\}\)" *$/\1/p' \
                         third_party/skia/METADATA)
          test "$metadata_sha" = "$skia_ref" || {
            echo "third_party/skia/METADATA and the wcs SKIA_REF disagree:" >&2
            echo "  METADATA: ${metadata_sha:-<unset, or not a 40-char sha>}" >&2
            echo "  wcs     : $skia_ref" >&2
            echo "Both name the commit this prefix is built from, so they have to match." >&2
            exit 1; }
          # The image goes in the key too. The prefix is a compiled artifact: one built on
          # noble and restored onto a newer image would link against a different libstdc++,
          # freetype and fontconfig, and the old key -- which carried only `runner.os`, so
          # `Linux` -- had nothing in it to show that. Same failure as a branch name in the
          # key, one layer down.
          os_id=$(. /etc/os-release && echo "${ID}${VERSION_ID}")
          test -n "$os_id" || { echo "/etc/os-release names no ID/VERSION_ID" >&2; exit 1; }
          echo "os_id=$os_id" >> "$GITHUB_OUTPUT"
          echo "wcs_rev=$wcs_rev" >> "$GITHUB_OUTPUT"
          echo "skia_key=$skia_ref" >> "$GITHUB_OUTPUT"
          echo "$os_id, wcs $wcs_rev, skia $skia_ref"

      - name: Restore the Skia prefix
        id: skia-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/skia-prefix
          key: skia-${{ steps.pins.outputs.os_id }}-x86_64-${{ steps.pins.outputs.skia_key }}-${{ steps.pins.outputs.wcs_rev }}

      - name: Free disk for the Skia build
        # Only on a miss, and only then because the checkout plus its synced third_party plus
        # an is_official_build out/ tree does not comfortably fit beside the image's preinstalled
        # language toolchains. Printed both ways so a future disk failure is readable.
        if: steps.skia-cache.outputs.cache-hit != 'true'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Install toolchain
        # Same mirror defenses as the stub job. The extra packages are all small dev headers:
        # wayland + wayland-protocols + xkbcommon are what have_wcs needs, vulkan + libdrm are
        # what the Ganesh present path needs, and pugixml is wcs's own parser (installing it
        # saves the subproject a download). freetype and fontconfig are needed twice over: the
        # GN args build Skia's bundled png/jpeg/webp/zlib/icu/harfbuzz but leave
        # skia_use_system_freetype2 and skia_use_fontconfig at their defaults, and acl's own
        # skia_dep then links both through pkg-config.
        timeout-minutes: 20
        run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for attempt in 1 2 3; do
            # shellcheck disable=SC2086
            timeout 300 sudo apt-get update -qq $apt_opts || true
            # shellcheck disable=SC2086
            if timeout 300 sudo apt-get install -y $apt_opts \
                 meson ninja-build g++ pkg-config libfmt-dev zlib1g-dev libssl-dev python3 \
                 libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev \
                 libvulkan-dev libdrm-dev libgbm-dev libegl-dev libgles-dev \
                 libfreetype-dev libfontconfig-dev libpugixml-dev; then
              exit 0
            fi
            echo "apt attempt ${attempt} failed or timed out; retrying"
            sleep 15
          done
          echo "apt failed three times" >&2
          exit 1

      - name: Build Skia at the pin
        if: steps.skia-cache.outputs.cache-hit != 'true'
        run: |
          "$RUNNER_TEMP/wcs/scripts/build-skia.sh" \
            --prefix "$HOME/skia-prefix" \
            --src "$RUNNER_TEMP/skia-src" \
            --jobs "$(nproc)"
          du -sh "$HOME/skia-prefix"
          # The source tree is several GB and nothing after this reads it; the cache stores the
          # prefix alone, so dropping it here keeps the rest of the job clear of a full disk.
          rm -rf "$RUNNER_TEMP/skia-src"
          df -h /

      - name: Save the Skia prefix
        # Saved here rather than at the end of the job. The combined cache action only writes on
        # a job that succeeds, and two runs in a row built Skia for 25 minutes, failed later in
        # acl's own compile and test steps, and threw the prefix away. Splitting restore from save
        # banks the expensive artifact the moment it exists, so a failure after this point costs
        # one run instead of one run plus the next rebuild.
        if: steps.skia-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/skia-prefix
          key: ${{ steps.skia-cache.outputs.cache-primary-key }}

      - name: Export JAVA_HOME for the JVM backend detection
        run: |
          jh="${JAVA_HOME_21_X64:-$JAVA_HOME}"
          test -f "$jh/include/jni.h" || { echo "no jni.h under $jh" >&2; exit 1; }
          echo "JAVA_HOME=$jh" >> "$GITHUB_ENV"

      - name: Fetch Catch2 (Tier A tests)
        run: meson wrap install catch2 || true

      - name: Configure, and assert this is the configuration the job is named for
        # Every one of these is optional in meson.build and degrades silently when its
        # dependencies are missing -- which is correct for a developer and useless for a CI job
        # whose entire purpose is to cover them. Without the assertion a missing libvulkan would
        # leave this job green while testing exactly what the stub job already tests.
        run: |
          set -o pipefail
          meson setup build-present -Dskia_prefix="$HOME/skia-prefix" 2>&1 | tee setup.log
          missing=0
          while IFS= read -r want; do
            if ! grep -qF "$want" setup.log; then
              echo "NOT ENABLED: $want" >&2
              missing=1
            fi
          done <<'WANTED'
          gfx/ Skia backend enabled
          gfx/ Ganesh Vulkan present path enabled
          wm/ Wayland presenter enabled
          WANTED
          exit $missing

      - name: Compile
        shell: bash
        run: meson compile -C build-present 2>&1 | tee compile-present.log
      - name: Zero warnings on the present path (Gate G0.e)
        run: ./scripts/check-warnings.sh compile-present.log

      - name: Run the stub
        run: ./build-present/src/shell/a4l

      - name: Test
        run: meson test -C build-present --print-errorlogs
